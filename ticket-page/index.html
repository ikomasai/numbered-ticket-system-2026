<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子整理券</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* ローディング */
    .loading-container {
      text-align: center;
      color: #fff;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 16px;
    }

    /* エラー */
    .error-container {
      text-align: center;
      color: #fff;
      max-width: 360px;
    }

    .error-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .error-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .error-message {
      font-size: 14px;
      opacity: 0.9;
    }

    /* チケットカード */
    .ticket-card {
      background: #fff;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .ticket-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 24px 24px 20px;
      text-align: center;
      color: #fff;
    }

    .ticket-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.9;
      margin-bottom: 4px;
    }

    .ticket-number {
      font-size: 56px;
      font-weight: bold;
      line-height: 1.1;
    }

    .ticket-body {
      padding: 24px;
    }

    .ticket-event-name {
      font-size: 22px;
      font-weight: bold;
      color: #1a1a2e;
      margin-bottom: 16px;
      text-align: center;
    }

    /* 区切り線（チケットの切り取り線風） */
    .ticket-divider {
      display: flex;
      align-items: center;
      margin: 0 -24px 20px;
      position: relative;
    }

    .ticket-divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      border-top: 2px dashed #e0e0e0;
    }

    .ticket-divider-circle-left,
    .ticket-divider-circle-right {
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
    }

    .ticket-divider-circle-left {
      left: -10px;
    }

    .ticket-divider-circle-right {
      right: -10px;
    }

    .ticket-info {
      margin-bottom: 8px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-size: 13px;
      color: #888;
      flex-shrink: 0;
      margin-right: 12px;
    }

    .info-value {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a2e;
      text-align: right;
    }

    /* タイプバッジ */
    .type-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
    }

    .type-badge.time-slot {
      background-color: #007AFF;
    }

    .type-badge.sequential {
      background-color: #34C759;
    }

    .ticket-footer {
      padding: 16px 24px;
      background: #f8f9fa;
      text-align: center;
      border-top: 1px solid #f0f0f0;
    }

    .footer-text {
      font-size: 12px;
      color: #888;
    }

    .saved-badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }

    /* 非表示 */
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- ローディング表示 -->
  <div id="loading" class="loading-container">
    <div class="spinner"></div>
    <p class="loading-text">整理券を読み込み中...</p>
  </div>

  <!-- エラー表示 -->
  <div id="error" class="error-container hidden">
    <div class="error-icon">!</div>
    <p class="error-title">整理券が見つかりません</p>
    <p id="error-message" class="error-message">QRコードが無効か、有効期限が切れている可能性があります。</p>
  </div>

  <!-- チケット表示 -->
  <div id="ticket" class="ticket-card hidden">
    <div class="ticket-header">
      <p class="ticket-label">整理番号</p>
      <p id="ticket-number" class="ticket-number"></p>
    </div>
    <div class="ticket-body">
      <p id="ticket-event-name" class="ticket-event-name"></p>
      <div class="ticket-divider">
        <div class="ticket-divider-circle-left"></div>
        <div class="ticket-divider-circle-right"></div>
      </div>
      <div id="ticket-info" class="ticket-info"></div>
    </div>
    <div class="ticket-footer">
      <p class="footer-text">この画面をスクリーンショットで保存してください</p>
      <p id="saved-badge" class="saved-badge hidden">端末に保存済み</p>
    </div>
  </div>

  <!-- Supabase JS Client (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    /**
     * Supabase設定
     * Cloudflare Pagesの環境変数、またはここに直接設定
     */
    const SUPABASE_URL = 'https://qlldsvpkcfftbibujltf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsbGRzdnBrY2ZmdGJpYnVqbHRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NDM2NTYsImV4cCI6MjA4NTUxOTY1Nn0.K5h7KXAfoHkElETk5ihxVBR0hhiMQXToCfaOwGjIP7c';

    /** 企画タイプラベル */
    const EVENT_TYPE_LABELS = {
      time_slot: '時間枠定員制',
      sequential: '順次案内制',
    };

    /** 曜日ラベル */
    const DAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

    /**
     * 日付を「M/D(曜)」形式にフォーマット
     * @param {string} dateStr - YYYY-MM-DD形式の日付文字列
     * @returns {string} フォーマットされた日付
     */
    const formatDateWithDay = (dateStr) => {
      const date = new Date(dateStr + 'T00:00:00');
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const dayOfWeek = DAY_LABELS[date.getDay()];
      return `${month}/${day}(${dayOfWeek})`;
    };

    /**
     * 時間枠表示をフォーマット
     * @param {string} startTime - 開始時刻（HH:MM:SS形式）
     * @param {string} endTime - 終了時刻（HH:MM:SS形式）
     * @returns {string} フォーマットされた時間枠
     */
    const formatTimeSlot = (startTime, endTime) => {
      const start = startTime.substring(0, 5);
      const end = endTime.substring(0, 5);
      return `${start}〜${end}`;
    };

    /**
     * DOM要素を表示/非表示切り替え
     * @param {string} id - 要素ID
     * @param {boolean} show - 表示するか
     */
    const toggleElement = (id, show) => {
      const el = document.getElementById(id);
      if (show) {
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    };

    /**
     * エラー画面を表示
     * @param {string} message - エラーメッセージ
     */
    const showError = (message) => {
      toggleElement('loading', false);
      toggleElement('ticket', false);
      toggleElement('error', true);
      if (message) {
        document.getElementById('error-message').textContent = message;
      }
    };

    /**
     * チケット情報を表示
     * @param {Object} ticketData - チケットデータ
     */
    const showTicket = (ticketData) => {
      toggleElement('loading', false);
      toggleElement('error', false);
      toggleElement('ticket', true);

      /** 整理番号 */
      document.getElementById('ticket-number').textContent = ticketData.ticket_number;

      /** 企画名 */
      document.getElementById('ticket-event-name').textContent = ticketData.events.name;

      /** 情報セクション */
      const infoContainer = document.getElementById('ticket-info');
      infoContainer.innerHTML = '';

      /** 企画タイプ */
      const typeLabel = EVENT_TYPE_LABELS[ticketData.events.type] || ticketData.events.type;
      const typeBadgeClass = ticketData.events.type === 'time_slot' ? 'time-slot' : 'sequential';
      addInfoRow(infoContainer, 'タイプ', `<span class="type-badge ${typeBadgeClass}">${typeLabel}</span>`);

      /** 場所 */
      addInfoRow(infoContainer, '場所', ticketData.events.location);

      /** 日付 */
      addInfoRow(infoContainer, '日付', formatDateWithDay(ticketData.event_dates.date));

      /** 時間枠（時間枠定員制の場合のみ） */
      if (ticketData.time_slots) {
        addInfoRow(infoContainer, '時間枠', formatTimeSlot(
          ticketData.time_slots.start_time,
          ticketData.time_slots.end_time
        ));
      }

      /** 発行日時 */
      const issuedAt = new Date(ticketData.issued_at);
      const issuedText = `${issuedAt.getMonth() + 1}/${issuedAt.getDate()} ${String(issuedAt.getHours()).padStart(2, '0')}:${String(issuedAt.getMinutes()).padStart(2, '0')}`;
      addInfoRow(infoContainer, '発行日時', issuedText);
    };

    /**
     * 情報行を追加
     * @param {HTMLElement} container - 追加先コンテナ
     * @param {string} label - ラベル
     * @param {string} value - 値（HTMLを含む場合あり）
     */
    const addInfoRow = (container, label, value) => {
      const row = document.createElement('div');
      row.className = 'info-row';
      row.innerHTML = `
        <span class="info-label">${label}</span>
        <span class="info-value">${value}</span>
      `;
      container.appendChild(row);
    };

    /**
     * localStorage にチケットデータを保存
     * @param {string} token - QRトークン
     * @param {Object} ticketData - チケットデータ
     */
    const saveToLocalStorage = (token, ticketData) => {
      try {
        /** 保存済みチケット一覧 */
        const savedTickets = JSON.parse(localStorage.getItem('saved_tickets') || '{}');
        savedTickets[token] = {
          data: ticketData,
          savedAt: new Date().toISOString(),
        };
        localStorage.setItem('saved_tickets', JSON.stringify(savedTickets));
        toggleElement('saved-badge', true);
      } catch (e) {
        console.error('localStorage保存エラー:', e);
      }
    };

    /**
     * localStorage からチケットデータを取得
     * @param {string} token - QRトークン
     * @returns {Object|null} キャッシュされたチケットデータ
     */
    const loadFromLocalStorage = (token) => {
      try {
        const savedTickets = JSON.parse(localStorage.getItem('saved_tickets') || '{}');
        return savedTickets[token]?.data || null;
      } catch {
        return null;
      }
    };

    /**
     * メイン処理
     * URLからトークンを取得し、チケット情報を表示
     */
    const main = async () => {
      /** URLパラメータからトークンを取得 */
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        showError('整理券のURLが正しくありません。QRコードを再度読み取ってください。');
        return;
      }

      // localStorage にキャッシュがあれば先に表示
      const cachedData = loadFromLocalStorage(token);
      if (cachedData) {
        showTicket(cachedData);
        toggleElement('saved-badge', true);
        return;
      }

      // Supabase からチケットデータを取得
      try {
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const { data, error } = await supabaseClient
          .from('tickets')
          .select(`
            ticket_number,
            medium_type,
            issued_at,
            events:event_id (
              name,
              location,
              type
            ),
            event_dates:event_date_id (
              date
            ),
            time_slots:time_slot_id (
              start_time,
              end_time
            )
          `)
          .eq('qr_token', token)
          .single();

        if (error || !data) {
          showError('整理券が見つかりませんでした。QRコードが無効か、有効期限が切れている可能性があります。');
          return;
        }

        // 表示
        showTicket(data);

        // localStorage に保存
        saveToLocalStorage(token, data);
      } catch (e) {
        console.error('チケット取得エラー:', e);
        showError('整理券の読み込みに失敗しました。通信環境を確認してください。');
      }
    };

    // ページ読み込み時に実行
    main();
  </script>
</body>
</html>
